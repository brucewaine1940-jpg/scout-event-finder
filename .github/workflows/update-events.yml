name: Update events

on:
  schedule:
    - cron: "17 10 * * *"   # every day ~3:17 AM Pacific
  workflow_dispatch:         # lets you click "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests beautifulsoup4 icalendar recurring-ical-events python-dateutil

      - name: ZIP code table (first run only)
        run: python scraper/build_zips.py

      - name: Collect events from global.scoutingevent.com
        run: python scraper/scrape_global.py

      - name: Extra council feeds (optional)
        run: python scraper/extra_feeds.py || echo "extra feeds skipped"

      - name: Eventbrite organizers (needs EVENTBRITE_TOKEN secret)
        run: python scraper/eventbrite.py || echo "eventbrite skipped"
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}

      - name: National Park Service ranger programs (needs NPS_API_KEY secret)
        run: python scraper/nps.py || echo "nps skipped"
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}

      - name: Recreation.gov group campsites (needs RIDB_API_KEY secret)
        run: python scraper/ridb.py || echo "ridb skipped"
        env:
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}

      - name: Merit badge providers
        run: python scraper/providers.py || echo "providers skipped"

      - name: Calendar feeds
        run: python scraper/build_feeds.py

      - name: Save changes
        run: |
          git config user.name  "event-bot"
          git config user.email "event-bot@users.noreply.github.com"
          git add docs/data docs/feeds data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update events $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main || true
            git push
          fi
