name: Update events

on:
  schedule:
    - cron: "17 10 * * *"   # every day ~3:17 AM Pacific
  workflow_dispatch:         # lets you click "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests beautifulsoup4 icalendar

      - name: ZIP code table (first run only)
        run: python scraper/build_zips.py

      - name: Collect events from global.scoutingevent.com
        run: python scraper/scrape_global.py

      - name: Extra council feeds (optional)
        run: python scraper/extra_feeds.py || echo "extra feeds skipped"

      - name: Calendar feeds
        run: python scraper/build_feeds.py

      - name: Save changes
        run: |
          git config user.name  "event-bot"
          git config user.email "event-bot@users.noreply.github.com"
          git add docs/data docs/feeds data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update events $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main || true
            git push
          fi
